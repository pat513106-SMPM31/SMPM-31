<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102137"><link rel="manifest" href="manifest.webmanifest"><title>SMPM31</title><style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,Arial;background:#edf2f7;color:#183047}header{background:#102137;color:white;padding:18px 22px}header h1{margin:0}header small{color:#b5cbe1}.wrap{max-width:960px;margin:auto;padding:16px}.card{background:white;padding:20px;border-radius:14px;margin:14px 0;box-shadow:0 2px 10px #15345316}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #c5d3df}input,select{width:100%}button{cursor:pointer;background:#1265a3;color:white;border:0}button.secondary{background:#e6edf5;color:#163451}button.danger{background:#a52e37}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}label{display:block;margin:12px 0 5px;font-weight:600;font-size:14px}.muted{color:#617487;font-size:13px}.hidden{display:none!important}.doc{border-top:1px solid #e2eaf1;padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.doc strong{display:block}.doc a{color:#075b9b}.tag{background:#e6eff8;padding:3px 7px;border-radius:5px;font-size:12px}.msg{padding:12px;border-radius:9px;background:#fff4d5;margin:10px 0}.error{background:#ffe5e7}.nav{display:flex;gap:8px;overflow:auto}.nav button{white-space:nowrap;background:#e0eaf4;color:#193651}.nav button.active{background:#1265a3;color:white}@media(max-width:520px){.wrap{padding:10px}.card{padding:15px}}
</style></head><body><header><h1>⛰ SMPM31</h1><small>Secours en Milieux Périlleux et Montagne</small></header><main class="wrap">
<div id="notice" class="msg">Chargement…</div>
<section id="login" class="card hidden"><h2>Connexion personnelle</h2><form id="loginForm"><label>Adresse e-mail</label><input id="email" type="email" required autocomplete="username"><label>Mot de passe</label><input id="password" type="password" required autocomplete="current-password"><p><button type="submit">Se connecter</button></p></form><button class="secondary" id="resetPassword">Recevoir un lien de réinitialisation</button><p class="muted">Les comptes sont créés et activés par les responsables habilités.</p></section>
<section id="app" class="hidden"><div class="card row"><div><strong id="identity"></strong><div class="muted" id="role"></div></div><button class="secondary" id="logout" style="flex:0 0 auto">Déconnexion</button></div>
<div class="nav"><button class="active" data-tab="docs">GDO / GTO</button><button data-tab="man">Manœuvres</button><button data-tab="eval">Évaluations annuelles</button><button data-tab="tech">Fiches techniques</button></div>
<section id="docs"><div class="card"><h2>Bibliothèque GDO / GTO</h2><div class="row"><input type="search" id="search" placeholder="Rechercher un document"><select id="filter"><option value="">Toutes les catégories</option><option>GDO</option><option>GTO</option></select></div><div id="list"></div></div>
<div id="manage" class="card hidden"><h2 id="formHeading">Ajouter un document</h2><form id="docForm"><input type="hidden" id="docId"><label>Titre</label><input id="title" maxlength="200" required><label>Catégorie</label><select id="category"><option>GDO</option><option>GTO</option></select><label>Source / organisme</label><input id="sourceName"><label>Date de publication</label><input id="publishedOn" type="date"><label>Type</label><select id="documentType"><option value="link">Lien HTTPS officiel</option><option value="pdf">PDF (10 Mo maximum)</option></select><div id="urlGroup"><label>Lien HTTPS</label><input id="externalUrl" type="url" placeholder="https://..."></div><div id="pdfGroup" class="hidden"><label>Fichier PDF</label><input id="pdf" type="file" accept="application/pdf,.pdf"></div><p class="row"><button type="submit" id="saveBtn">Enregistrer</button><button type="button" class="secondary" id="cancel">Annuler</button></p></form></div></section>
<div id="later" class="card hidden"><h2 id="laterTitle"></h2><p>Rubrique prévue pour une prochaine version.</p></div></section>
</main><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
